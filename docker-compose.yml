services:
  db:
    image: postgres:16
    container_name: healthytrack_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: healthytrack
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./database_migration_full_name.sql:/docker-entrypoint-initdb.d/migration.sql:ro
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh:ro
    networks:
      - healthytrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthytrack_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/healthytrack
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin1234
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthytrack-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  healthytrack-network:
    driver: bridge