services:
  db:
    image: postgres:16
    container_name: healthytrack_db
    environment:
      POSTGRES_USER: healthyuser
      POSTGRES_PASSWORD: healthypass
      POSTGRES_DB: healthytrack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - healthytrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthyuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthytrack_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/healthytrack
      SPRING_DATASOURCE_USERNAME: healthyuser
      SPRING_DATASOURCE_PASSWORD: healthypass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthytrack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: healthytrack_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthytrack-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  healthytrack-network:
    driver: bridge